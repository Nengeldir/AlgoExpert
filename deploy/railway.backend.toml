# Railway service config for the BACKEND.
# In the Railway dashboard, create a service from this repo and set its
# "Config-as-code path" to deploy/railway.backend.toml (or rename this to
# railway.toml inside a dedicated service root if you split repos later).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backend.railway"

[deploy]
# The app exposes /health (returns {status:"ok"}); Railway uses it to gate
# traffic until the service is actually ready.
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# NOTE: scale-to-zero ("serverless") IS compatible with this service.
# An earlier version ran setInterval jobs for the YouTube + SMI auto-resolvers, which
# sleeping would have stopped. Those are gone — all scheduling is now external HTTP cron
# hitting idempotent /admin/smi/* and /admin/youtube/* endpoints (see
# docs-site/content/cron-setup.md), so the first call of the morning simply wakes the
# container. Allow for a cold start of a few seconds; the schedule has an hour of slack
# before the 08:00 publish, so this is harmless.
